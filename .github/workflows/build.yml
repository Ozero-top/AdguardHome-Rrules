name: build-rules

on:
  schedule:
    # 每 7 天 03:00 UTC（北京时间 11:00）重建一次
    - cron: "0 3 */7 * *"
  push:
    # 源清单或构建脚本变更时立即重建
    branches: [main]
    paths:
      - "sources.toml"
      - "tools/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:
    inputs:
      allow_drift:
        description: "允许条数波动（重构规则时勾选）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-rules
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 构建规则
        run: python tools/build.py --out build

      - name: 取上轮结果做波动对比
        run: |
          mkdir -p previous
          git fetch --depth=1 origin dist || true
          git show FETCH_HEAD:meta.json > previous/meta.json 2>/dev/null || true

      - name: 产物门禁
        run: |
          # 主动重构（分类调整、规则语义修正）会造成条数大幅波动，此时允许带 --allow-drift。
          # 检查最近 5 条提交，便于同一次重构的多个提交共用标记。
          if [ "${{ inputs.allow_drift }}" = "true" ] || git log -5 --pretty=%B | grep -q "\[allow-drift\]"; then
            python tools/verify.py --out build --previous previous/meta.json --allow-drift
          else
            python tools/verify.py --out build --previous previous/meta.json
          fi

      - name: 保存产物
        uses: actions/upload-artifact@v4
        with:
          name: rules-${{ github.run_number }}
          path: build/
          retention-days: 30

      - name: 发布到 dist 分支
        run: |
          set -e
          rm -rf /tmp/publish
          mkdir -p /tmp/publish
          cp -r build/. /tmp/publish/
          cd /tmp/publish
          git init -q
          git checkout -q -b dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "rules: $(date -u +%Y-%m-%d)"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" dist

      - name: 清理 jsDelivr 缓存
        # jsDelivr 对 @分支 文件缓存 12 小时，发布后主动 purge，避免订阅端长时间拿到旧产物
        # purge 失败不影响本次发布，仅记录日志
        run: |
          set -u
          # 等 jsDelivr 感知到 dist 分支新提交后再发 purge
          sleep 5
          while IFS= read -r file; do
            rel="${file#build/}"
            if curl -fsS --retry 2 --max-time 30 \
              "https://purge.jsdelivr.net/gh/${{ github.repository }}@dist/${rel}" > /dev/null; then
              echo "OK   $rel"
            else
              echo "FAIL $rel"
            fi
            sleep 1
          done < <(find build -type f \( -name '*.txt' -o -name 'meta.json' \) | sort)
