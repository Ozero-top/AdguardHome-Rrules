name: build-rules

on:
  schedule:
    # 每天 10:00 UTC（北京时间 18:00）重建一次
    - cron: "0 10 * * *"
  push:
    # 源清单或构建脚本变更时立即重建
    branches: [main]
    paths:
      - "sources.toml"
      - "tools/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:
    inputs:
      allow_drift:
        description: "允许条数波动（重构规则时勾选）"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: build-rules
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 构建规则
        run: python tools/build.py --out build

      - name: 取上轮结果做波动对比
        run: |
          mkdir -p previous
          git fetch --depth=1 origin dist || true
          git show FETCH_HEAD:meta.json > previous/meta.json 2>/dev/null || true

      - name: 产物门禁
        run: |
          # 主动重构（分类调整、规则语义修正）会造成条数大幅波动，此时允许带 --allow-drift。
          # 检查最近 5 条提交，便于同一次重构的多个提交共用标记。
          # 先取完整提交信息再 grep，避免 pipefail 下 grep -q 提前退出让 git 收到 SIGPIPE。
          set -o pipefail
          recent=$(git log -5 --pretty=%B)
          if [ "${{ inputs.allow_drift }}" = "true" ] || printf '%s' "$recent" | grep -q "\[allow-drift\]"; then
            python tools/verify.py --out build --previous previous/meta.json --allow-drift 2>&1 | tee verify.log
          else
            python tools/verify.py --out build --previous previous/meta.json 2>&1 | tee verify.log
          fi

      - name: 保存产物
        uses: actions/upload-artifact@v4
        with:
          name: rules-${{ github.run_number }}
          path: build/
          retention-days: 30

      - name: 发布到 dist 分支
        run: |
          set -e
          rm -rf /tmp/publish
          mkdir -p /tmp/publish
          cp -r build/. /tmp/publish/
          cd /tmp/publish
          git init -q
          git checkout -q -b dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "rules: $(date -u +%Y-%m-%d)"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" dist

      - name: 生成发布说明
        run: python tools/release_notes.py build/meta.json previous/meta.json release-notes.md

      - name: 发布 Release
        # 每次构建留一条记录：各档位增减、源波动、维护清单，方便回溯
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          version=$(python -c "import json;print(json.load(open('build/meta.json'))['version'])")
          tag="rules-${version}-${{ github.run_number }}"
          gh release create "$tag" \
            --title "规则更新 ${version}" \
            --notes-file release-notes.md \
            --latest

      - name: 清理 jsDelivr 缓存
        # jsDelivr 对 @分支 文件缓存 12 小时，发布后主动 purge，避免订阅端长时间拿到旧产物
        # purge 失败不影响本次发布，仅记录日志
        run: |
          set -u
          # 等 jsDelivr 感知到 dist 分支新提交后再发 purge
          sleep 5
          while IFS= read -r file; do
            rel="${file#build/}"
            if curl -fsS --retry 2 --max-time 30 \
              "https://purge.jsdelivr.net/gh/${{ github.repository }}@dist/${rel}" > /dev/null; then
              echo "OK   $rel"
            else
              echo "FAIL $rel"
            fi
            sleep 1
          done < <(find build -type f \( -name '*.txt' -o -name 'meta.json' \) | sort)

      - name: 门禁失败时开 Issue
        # 定时任务失败不会有人盯着 Actions 页面，开 Issue 才能被发现；
        # 已有未关闭的同类 Issue 时只追加评论，避免每周刷一条。
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body=$(printf '构建未通过门禁，`dist` 保留上一版产物。\n\n运行记录：%s\n\n```\n%s\n```\n' \
            "$run_url" "$(tail -n 30 verify.log 2>/dev/null || echo '未生成 verify.log，失败发生在门禁之前')")
          existing=$(gh issue list --state open --search '构建门禁失败 in:title' --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "构建门禁失败（$(date -u +%Y-%m-%d)）" --body "$body"
          fi
