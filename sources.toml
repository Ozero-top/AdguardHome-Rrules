# ---------------- 子域聚合 ----------------
# 把同一根域下大量广告子域收敛成整域规则，覆盖平台临时新增的子域。
# 每次构建都会产出 build/agg-candidates.txt（根域、子域数、最小收录源数）。
# auto = false 时只生成候选；确认无误后把根域写进 tools/ad-roots.txt 即可并入 ads。
# 注意：自动并入（auto = true）会拦掉整个根域，实测候选里出现过 americanexpress.co.uk、
# ricoh.ch 这类有真实主站的域名，因此默认关闭。
[aggregation]
auto = false
min_children = 10
min_sources = 3

# ---------------- 档位定义 ----------------
# 列表顺序即「一条规则在档内的归属优先级」，靠前的分类先拿到规则；
# 每条规则在档内只归属一个分类，保证同档各文件互不重复。
[tiers]
"512" = ["security", "chinese", "ads"]
"1024" = ["security", "chinese", "tracking", "ads"]
"2048" = ["security", "chinese", "tracking", "ads", "annoyances"]

# 各档单分类条数预算：超出时按「源可信度 → 被更多上游收录 → 域名」排序截断
# 经验值：AdGuard Home 每条约占 100~200 字节内存，512MB 设备建议总量 15 万以内
[budgets."512"]
security = 15000
chinese = 60000
ads = 60000

[budgets."1024"]
security = 15000
chinese = 120000
tracking = 8000
ads = 120000

# 源可信度：预算截断时数值大的源优先保留，未列出的源按 0 处理。
# 只影响 512MB/1GB 档「留谁」，不改变各档总条数与内存占用；2048 档不截断。
# 排序理由：官方/专项精编清单优先于大型聚合清单，避免恶意软件域名被字母序随机切掉。
[source_priority]
hostlist-malware = 100
hostlist-tracking = 95
adg-chinese = 90
adg-base = 90
adg-dnsfilter = 90
hostlist-dns = 90
antiad = 85
adg-spyware = 80
hagezi-pro = 80
hostlist-adaway = 70
awavenue = 70
easyprivacy = 70
hagezi-tif-mini = 65
goodbye-ads-dns = 60
goodbye-ads-domain = 60
easylist = 55
oisd-big = 55
adrules-dns = 50
xinggsf = 50
hagezi-pro-mini = 50
home-dns-adblock = 40
heidai-filters = 40
heidai-filters-lite = 35
my-ads-rule = 30
shadowrocket-startup-ad = 20
adg-mobile = 20

